name: CrossMail Core CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 单元测试 + 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --workspace --all-targets -- --nocapture

  cross-compile:
    name: 多架构编译 ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # MSVC ABI：纯 Rust core 静态库；gnullvm ABI：含 C 依赖的协议层
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-pc-windows-gnullvm
          - aarch64-pc-windows-gnullvm
          - aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Windows MSVC ABI 在 Linux 上用 zig 作为 C 编译器/链接器（与本机一致）
      - name: 安装 zig（纯用户态 C 工具链）
        run: |
          python3 -m venv "$RUNNER_TEMP/zigvenv"
          "$RUNNER_TEMP/zigvenv/bin/pip" install -q ziglang
          echo "CROSSMAIL_PYTHON=$RUNNER_TEMP/zigvenv/bin/python" >> "$GITHUB_ENV"
      - name: 安装 Android NDK r27c
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: 编译核心库 / 原生库
        run: bash scripts/build-cross.sh ${{ matrix.target }}
      - name: 生成 uniffi Kotlin 绑定 + AAR
        if: matrix.target == 'aarch64-linux-android'
        run: bash scripts/build-aar.sh
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: crossmail-${{ matrix.target }}
          path: |
            target/**/release/crossmail_core.lib
            target/**/release/libcrossmail_core.a
            target/**/release/libcrossmail_ffi.so
            build/android/crossmail-core.aar
          if-no-files-found: ignore
