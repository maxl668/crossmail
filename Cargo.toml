[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/jmap",
    "crates/imap",
    "crates/sync",
    "crates/service",
    "crates/sanitize",
    "crates/obs",
    "crates/app",
    "crates/ffi",
]
# ffi 依赖 uniffi，单独显式检查，避免拖累核心库日常测试
# app 依赖 imap/jmap/sync，不依赖 uniffi，纳入日常测试
default-members = [
    "crates/core",
    "crates/storage",
    "crates/jmap",
    "crates/imap",
    "crates/sync",
    "crates/service",
    "crates/sanitize",
    "crates/obs",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
crossmail-core = { path = "crates/core" }
crossmail-storage = { path = "crates/storage" }
crossmail-jmap = { path = "crates/jmap" }
crossmail-imap = { path = "crates/imap" }
crossmail-sync = { path = "crates/sync" }
crossmail-service = { path = "crates/service" }
crossmail-sanitize = { path = "crates/sanitize" }
crossmail-obs = { path = "crates/obs" }
crossmail-app = { path = "crates/app" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
# 显式关闭 aws_lc_rs 默认加密后端：纯 ring 实现，避免重 C 依赖破坏 Windows ARM / Android 交叉编译
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# RFC 8887 JMAP over WebSocket：同样走 rustls/ring，无 OpenSSL，交叉编译友好
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
webpki-roots = "0.26"
hickory-resolver = "0.24"
uniffi = { version = "0.28.3", features = ["cli"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
