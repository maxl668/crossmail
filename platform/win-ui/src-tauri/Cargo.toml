[workspace]

[package]
name = "crossmail-win-ui"
version = "0.1.0"
description = "CrossMail Windows 桌面端（Tauri）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["rt"] }
base64 = "0.22"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
crossmail-core = { path = "../../../crates/core" }
crossmail-storage = { path = "../../../crates/storage" }
crossmail-service = { path = "../../../crates/service" }
crossmail-app = { path = "../../../crates/app" }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
